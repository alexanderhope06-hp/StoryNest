<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wisdom Studio — StoryNest</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style1.css">

</head>

<body>

<header>
    <div class="container">
        <a href="index.html" class="logo">StoryNest</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="wisdom.html">Life & Wisdom</a>
        </nav>
    </div>
</header>


<main class="studio-container">

    <div class="studio-header">
        <h1>🧠 Wisdom Studio</h1>
        <p>Create, edit and publish Life & Wisdom posts for StoryNest.</p>

        <button id="logoutBtn" class="studio-btn logout-btn">
            Logout
        </button>
    </div>


    <!-- EDITOR -->

    <section class="studio-card">

        <h2 id="editorTitle">Create New Post</h2>

        <form id="wisdomForm">

            <input type="hidden" id="postId">

            <div class="form-group">
                <label for="title">Post Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Dear Son, never confuse..."
                    required
                >
            </div>


            <div class="form-group">
                <label for="category">Category</label>

                <select id="category" required>
                    <option value="">Select category</option>

                    <option value="my-son">My Son</option>

                    <option value="my-daughter">My Daughter</option>

                    <option value="my-friend">My Friend</option>

                    <option value="my-enemy">My Enemy</option>

                    <option value="things-nobody-tells-you">
                        Things Nobody Tells You
                    </option>

                    <option value="life-is-funny">
                        Life Is Funny
                    </option>

                    <option value="hard-truths">
                        Hard Truths
                    </option>

                    <option value="before-you-love-someone">
                        Before You Love Someone
                    </option>

                    <option value="one-minute-wisdom">
                        One Minute Wisdom
                    </option>
                </select>
            </div>


            <div class="form-group">
                <label for="excerpt">Short Description</label>

                <textarea
                    id="excerpt"
                    style="min-height:100px"
                    placeholder="A short description shown on the Life & Wisdom page..."
                ></textarea>
            </div>


            <div class="form-group">
                <label for="content">Post Content</label>

                <textarea
                    id="content"
                    placeholder="Write your wisdom here..."
                    required
                ></textarea>
            </div>


            <div class="form-group">
                <label for="highlight">Highlight</label>

                <input
                    type="text"
                    id="highlight"
                    placeholder="Example: Protect your peace."
                >
            </div>


            <div class="form-group">
                <label for="authorName">Author Name</label>

                <input
                    type="text"
                    id="authorName"
                    value="StoryNest"
                >
            </div>


            <div class="form-group">
                <label for="status">Status</label>

                <select id="status">

                    <option value="draft">
                        Save as Draft
                    </option>

                    <option value="published">
                        Publish
                    </option>

                </select>
            </div>


            <div class="button-row">

                <button
                    type="submit"
                    class="studio-btn publish-btn"
                >
                    Save Post
                </button>

                <button
                    type="button"
                    id="clearBtn"
                    class="studio-btn cancel-btn"
                >
                    Clear
                </button>

            </div>


            <div id="message" class="message"></div>

        </form>

    </section>


    <!-- POSTS -->

    <section class="studio-card">

        <h2>Your Wisdom Posts</h2>

        <div id="postList" class="post-list">
            Loading posts...
        </div>

    </section>

</main>


<footer>
    <div class="container">
        <p>© 2026 StoryNest — Stories Without Borders</p>
    </div>
</footer>


<!-- Your existing Supabase configuration -->
<script src="js/supabase.js"></script>

<!-- Wisdom Studio -->
<script src="js/wisdomStudio.js"></script>

</body>
</html>
