<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="reader-page">

    <!-- =====================================================
         READER HEADER
    ===================================================== -->


<header class="reader-header">

    <div class="reader-header-left">
        <a href="index.html" class="reader-back" title="Home">
            ←
        </a>
        <div class="reader-header-info">
            <strong id="readerNovelTitle">Loading...</strong>
            <span id="chapterHeader">Chapter 1</span>
        </div>
    </div>

    <div class="reader-actions">
        <button id="readerMenuBtn" class="reader-menu-btn" onclick="toggleReaderMenu(event)" title="Menu">
            ⋮
        </button>
        <div class="reader-dropdown" id="readerDropdown">
            <a href="#" onclick="goToNovelDetails(); return false;">📚 Novel Details</a>
            <a href="#" onclick="goHome(); return false;">🏠 Home</a>
            <a href="#" onclick="toggleFontSize(); return false;">🔤 Font Size</a>
            <a href="#" onclick="toggleTheme(); return false;">🌙 Dark Mode</a>
        </div>
    </div>

</header>

    <!-- =====================================================
         READING PROGRESS BAR
    ===================================================== -->

   <div class="reading-progress" id="readingProgress"></div> 

    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="reader-container">
        <div class="reader-page-content" id="readerPageContent">

            <h1 id="chapterTitle">Loading...</h1>

            <article class="story" id="storyContent">
                <p>Loading chapter...</p>
            </article>

        </div>

        <!-- =====================================================
             CHAPTER NAVIGATION
        ===================================================== -->
<!--
        <div class="chapter-navigation">

            <button id="previousChapter" class="nav-btn prev-btn">
                ← Previous
            </button>

            <button id="nextChapter" class="nav-btn next-btn">
                Next →
            </button>

        </div>
-->
        <!-- =====================================================
             CHAPTER PROGRESS INDICATOR
        ===================================================== -->

        <div class="chapter-progress" id="chapterProgress">
            <span id="currentChapterNum">1</span>
            <span class="progress-separator">/</span>
            <span id="totalChapters">0</span>
        </div>

    </main>

    <!-- =====================================================
         SCRIPTS
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/reader.js"></script>

<!-- Simple menu toggle -->
<script>
    function toggleReaderMenu(event) {
        event.stopPropagation();
        const dropdown = document.getElementById('readerDropdown');
        if (dropdown) dropdown.classList.toggle('active');
    }

    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('readerDropdown');
        const menuBtn = document.getElementById('readerMenuBtn');
        if (dropdown && menuBtn && !dropdown.contains(e.target) && e.target !== menuBtn) {
            dropdown.classList.remove('active');
        }
    });

    function goToNovelDetails() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) window.location.href = 'novel.html?id=' + id;
    }

    function goHome() {
        window.location.href = 'index.html';
    }

    function toggleFontSize() {
        const content = document.querySelector('.reader-page-content');
        if (!content) return;
        let size = parseInt(localStorage.getItem('readerFontSize')) || 18;
        size = size >= 24 ? 16 : size + 2;
        localStorage.setItem('readerFontSize', size);
        content.style.fontSize = size + 'px';
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
        localStorage.setItem('readerTheme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    }

    // Restore preferences
    document.addEventListener('DOMContentLoaded', function() {
        const savedSize = localStorage.getItem('readerFontSize');
        if (savedSize) {
            const content = document.querySelector('.reader-page-content');
            if (content) content.style.fontSize = savedSize + 'px';
        }
        if (localStorage.getItem('readerTheme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    });
</script>

</body>
</html>
