<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reading — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="image/fav.png">
</head>

<body class="reader-page">

    <!-- =====================================================
         READER HEADER
    ===================================================== -->

    <header class="reader-header">
        <a href="index.html" class="logo">
            <img src="image/fav.png" alt="StoryNest" class="logo-icon">
        </a>
        <div class="reader-header-left">
            <a href="index.html" class="reader-back" title="Home">←</a>
            <div class="reader-header-info">
                <strong id="readerNovelTitle">Loading...</strong>
                <span id="chapterHeader">Chapter 1</span>
            </div>
        </div>

        <div class="reader-actions">
            <button id="readerMenuBtn" class="reader-menu-btn" onclick="toggleReaderMenu(event)" title="Menu">⋮</button>
            <div class="reader-dropdown" id="readerDropdown">
                <a href="#" onclick="goToNovelDetails(); return false;">📚 Novel Details</a>
                <a href="#" onclick="goHome(); return false;">🏠 Home</a>
                <a href="#" onclick="toggleFontSize(); return false;" id="fontSizeBtn">🔤 18px</a>
                <a href="#" onclick="toggleTheme(); return false;" id="themeBtn">🌙 Dark Mode</a>
            </div>
        </div>
    </header>

    <!-- =====================================================
         READING PROGRESS BAR
    ===================================================== -->

    <div class="reading-progress" id="readingProgress"></div>

    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="reader-container">
        <div class="reader-page-content" id="readerPageContent">
            <h1 id="chapterTitle">Loading...</h1>
            <div class="story" id="storyContent">
                <p>Loading chapter...</p>
            </div>
        </div>
    </main>

    <!-- =====================================================
         AD SPACE - EMPTY (Reserved for future ads)
    ===================================================== -->

    <div class="reader-ad-space" id="readerAdSpace"></div>

    <!-- =====================================================
         SCRIPTS
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reader.js"></script>

    <!-- Reader Menu & Controls -->
    <script>
        // =====================================================
        // SCROLL LOCK (hard)
        // =====================================================
        // Some mobile browsers ignore overflow:hidden on body.
        // This keeps the reader pinned so only page-turn gestures work.

        (function lockScrolling() {
            // Lock document scroll
            document.documentElement.style.overflow = 'hidden';
            document.documentElement.style.height = '100%';
            document.body.style.overflow = 'hidden';
            document.body.style.height = '100%';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.style.top = '0';
            document.body.style.left = '0';
            document.body.style.right = '0';
            document.body.style.bottom = '0';
            document.body.style.overscrollBehavior = 'none';

            // Prevent wheel scrolling entirely
            window.addEventListener('wheel', function (e) {
                // Only block if the wheel is over the reader content area
                if (e.target.closest('.reader-page-content, .reader-container')) {
                    e.preventDefault();
                }
            }, { passive: false });

            // Prevent touchmove scrolling inside the reader
            window.addEventListener('touchmove', function (e) {
                if (e.target.closest('.reader-page-content, .reader-container, .reader-ad-space')) {
                    // Allow horizontal swipes (page turns) but block vertical
                    const t = e.touches[0];
                    if (!t) return;
                    // If we can't detect direction here, just block.
                    // Horizontal swipe detection happens in touchend in reader.js.
                    e.preventDefault();
                }
            }, { passive: false });

            // Prevent keyboard scroll keys from moving the page
            window.addEventListener('keydown', function (e) {
                const scrollKeys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '];
                if (scrollKeys.includes(e.key)) {
                    const el = document.activeElement;
                    const tag = el ? el.tagName : '';
                    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                        e.preventDefault();
                    }
