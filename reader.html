<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="reader-page">

    <!-- =====================================================
         READER HEADER
    ===================================================== -->

    <header class="reader-header">

        <div class="reader-header-left">
            <a href="index.html" class="reader-back" title="Home">
                ←
            </a>
            <div class="reader-header-info">
                <strong id="readerNovelTitle">Loading...</strong>
                <span id="chapterHeader">Chapter 1</span>
            </div>
        </div>

        <div class="reader-actions">
            <button id="readerMenuBtn" class="reader-menu-btn" onclick="toggleReaderMenu(event)" title="Menu">
                ⋮
            </button>
            <div class="reader-dropdown" id="readerDropdown">
                <a href="#" onclick="goToNovelDetails(); return false;">📚 Novel Details</a>
                <a href="#" onclick="goHome(); return false;">🏠 Home</a>
                <a href="#" onclick="toggleFontSize(); return false;">🔤 Font Size</a>
                <a href="#" onclick="toggleTheme(); return false;">🌙 Dark Mode</a>
                <a href="#" onclick="togglePageMode(); return false;">📄 Page Mode</a>
            </div>
        </div>

    </header>

    <!-- =====================================================
         READING PROGRESS BAR
    ===================================================== -->

    <div class="reading-progress" id="readingProgress"></div>

    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="reader-container">

        <!-- Page Mode Controls -->
        <div class="page-controls" id="pageControls">
            <button class="page-nav-btn" id="prevPageBtn" onclick="previousPage()">←</button>
            <span id="pageIndicator">Page 1 of 1</span>
            <button class="page-nav-btn" id="nextPageBtn" onclick="nextPage()">→</button>
        </div>

        <div class="chapter-label">
            CHAPTER <span id="chapterNumber">1</span>
        </div>

        <h1 id="chapterTitle">Loading...</h1>

        <div class="story-wrapper">
            <article class="story" id="storyContent">
                <p>Loading chapter...</p>
            </article>
        </div>

        <!-- Page indicator at bottom -->
        <div class="page-indicator-bottom" id="pageIndicatorBottom">
            <span id="currentPageDisplay">1</span>
            <span class="page-separator">/</span>
            <span id="totalPagesDisplay">1</span>
        </div>

        <!-- =====================================================
             CHAPTER NAVIGATION
        ===================================================== -->

        <div class="chapter-navigation">

            <button id="previousChapter" class="nav-btn prev-btn">
                ← Previous
            </button>

            <button id="nextChapter" class="nav-btn next-btn">
                Next →
            </button>

        </div>

        <!-- =====================================================
             CHAPTER PROGRESS INDICATOR
        ===================================================== -->

        <div class="chapter-progress" id="chapterProgress">
            <span id="currentChapterNum">1</span>
            <span class="progress-separator">/</span>
            <span id="totalChapters">0</span>
        </div>

    </main>

    <!-- =====================================================
         SCRIPTS
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reader.js"></script>

    <!-- Menu Functions -->
    <script>
        function toggleReaderMenu(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('readerDropdown');
            if (dropdown) {
                dropdown.classList.toggle('active');
            }
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('readerDropdown');
            const menuBtn = document.getElementById('readerMenuBtn');
            if (dropdown && menuBtn) {
                if (!dropdown.contains(e.target) && e.target !== menuBtn) {
                    dropdown.classList.remove('active');
                }
            }
        });

        function goToNovelDetails() {
            const params = new URLSearchParams(window.location.search);
            const novelId = params.get('id');
            if (novelId) {
                window.location.href = 'novel.html?id=' + novelId;
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        let fontSize = parseInt(localStorage.getItem('readerFontSize')) || 18;
        
        function toggleFontSize() {
            const content = document.getElementById('storyContent');
            if (!content) return;
            
            if (fontSize < 24) {
                fontSize += 2;
            } else {
                fontSize = 16;
            }
            content.style.fontSize = fontSize + 'px';
            localStorage.setItem('readerFontSize', fontSize);
            
            // Recalculate pages after font change
            setTimeout(calculatePages, 100);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('readerTheme', isDark ? 'dark' : 'light');
            
            // Update menu text
            const themeBtn = document.querySelector('[onclick="toggleTheme()"]');
            if (themeBtn) {
                themeBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
            }
        }

        // Page Mode Toggle
        let pageMode = localStorage.getItem('readerPageMode') !== 'scroll';

        function togglePageMode() {
            pageMode = !pageMode;
            localStorage.setItem('readerPageMode', pageMode ? 'page' : 'scroll');
            
            const container = document.querySelector('.reader-container');
            const storyWrapper = document.querySelector('.story-wrapper');
            const pageControls = document.getElementById('pageControls');
            const pageIndicatorBottom = document.getElementById('pageIndicatorBottom');
            
            if (pageMode) {
                container.classList.add('page-mode');
                storyWrapper.classList.add('page-mode-wrapper');
                pageControls.style.display = 'flex';
                pageIndicatorBottom.style.display = 'flex';
                // Reset scroll position
                window.scrollTo(0, 0);
            } else {
                container.classList.remove('page-mode');
                storyWrapper.classList.remove('page-mode-wrapper');
                pageControls.style.display = 'none';
                pageIndicatorBottom.style.display = 'none';
            }
            
            // Update menu text
            const modeBtn = document.querySelector('[onclick="togglePageMode()"]');
            if (modeBtn) {
                modeBtn.textContent = pageMode ? '📜 Scroll Mode' : '📄 Page Mode';
            }
            
            // Recalculate pages if in page mode
            if (pageMode) {
                setTimeout(calculatePages, 100);
            }
        }

        // Restore preferences
        document.addEventListener('DOMContentLoaded', function() {
            const savedFontSize = localStorage.getItem('readerFontSize');
            if (savedFontSize) {
                fontSize = parseInt(savedFontSize);
                const content = document.getElementById('storyContent');
                if (content) {
                    content.style.fontSize = fontSize + 'px';
                }
            }

            const savedTheme = localStorage.getItem('readerTheme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                const themeBtn = document.querySelector('[onclick="toggleTheme()"]');
                if (themeBtn) {
                    themeBtn.textContent = '☀️ Light Mode';
                }
            }

            // Restore page mode
            if (pageMode) {
                const container = document.querySelector('.reader-container');
                const storyWrapper = document.querySelector('.story-wrapper');
                const pageControls = document.getElementById('pageControls');
                const pageIndicatorBottom = document.getElementById('pageIndicatorBottom');
                
                if (container) container.classList.add('page-mode');
                if (storyWrapper) storyWrapper.classList.add('page-mode-wrapper');
                if (pageControls) pageControls.style.display = 'flex';
                if (pageIndicatorBottom) pageIndicatorBottom.style.display = 'flex';
                
                const modeBtn = document.querySelector('[onclick="togglePageMode()"]');
                if (modeBtn) {
                    modeBtn.textContent = '📜 Scroll Mode';
                }
            }
        });
    </script>

</body>
</html>
