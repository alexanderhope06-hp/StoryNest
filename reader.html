<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reading — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="reader-page">

    <!-- =====================================================
         READER HEADER
    ===================================================== -->

    <header class="reader-header">

        <div class="reader-header-left">
            <a href="index.html" class="reader-back" title="Home">
                ←
            </a>
            <div class="reader-header-info">
                <strong id="readerNovelTitle">Loading...</strong>
                <span id="chapterHeader">Chapter 1</span>
            </div>
        </div>

        <div class="reader-actions">
            <button id="readerMenuBtn" class="reader-menu-btn" onclick="toggleReaderMenu(event)" title="Menu">
                ⋮
            </button>
            <div class="reader-dropdown" id="readerDropdown">
                <a href="#" onclick="goToNovelDetails(); return false;">📚 Novel Details</a>
                <a href="#" onclick="goHome(); return false;">🏠 Home</a>
                <a href="#" onclick="toggleFontSize(); return false;">🔤 Font Size</a>
                <a href="#" onclick="toggleTheme(); return false;">🌙 Dark Mode</a>
            </div>
        </div>

    </header>

    <!-- =====================================================
         READING PROGRESS BAR
    ===================================================== -->

    <div class="reading-progress" id="readingProgress"></div>

    <!-- =====================================================
         MAIN CONTENT - PAGE VIEWER
    ===================================================== -->

    <main class="reader-container" id="readerContainer">

        <!-- Chapter Label -->
        <div class="chapter-label">
            CHAPTER <span id="chapterNumber">1</span>
        </div>

        <h1 id="chapterTitle">Loading...</h1>

        <!-- Page Viewer - Swipeable -->
        <div class="page-viewer" id="pageViewer">
            
            <!-- Left swipe hint -->
            <div class="swipe-hint swipe-left" id="swipeLeftHint">‹</div>
            
            <!-- Page Content -->
            <div class="page-content" id="pageContent">
                <div class="page-inner" id="pageInner">
                    <p>Loading chapter...</p>
                </div>
            </div>
            
            <!-- Right swipe hint -->
            <div class="swipe-hint swipe-right" id="swipeRightHint">›</div>
            
        </div>

        <!-- Page Indicator -->
        <div class="page-indicator" id="pageIndicator">
            <span id="currentPageDisplay">1</span>
            <span class="page-separator">/</span>
            <span id="totalPagesDisplay">1</span>
        </div>

        <!-- =====================================================
             CHAPTER NAVIGATION
        ===================================================== -->

        <div class="chapter-navigation">

            <button id="previousChapter" class="nav-btn prev-btn">
                ← Previous Chapter
            </button>

            <button id="nextChapter" class="nav-btn next-btn">
                Next Chapter →
            </button>

        </div>

        <!-- Chapter Progress -->
        <div class="chapter-progress" id="chapterProgress">
            <span id="currentChapterNum">1</span>
            <span class="progress-separator">/</span>
            <span id="totalChapters">0</span>
        </div>

    </main>

    <!-- =====================================================
         SCRIPTS
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reader.js"></script>

    <!-- Menu Functions -->
    <script>
        function toggleReaderMenu(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('readerDropdown');
            if (dropdown) {
                dropdown.classList.toggle('active');
            }
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('readerDropdown');
            const menuBtn = document.getElementById('readerMenuBtn');
            if (dropdown && menuBtn) {
                if (!dropdown.contains(e.target) && e.target !== menuBtn) {
                    dropdown.classList.remove('active');
                }
            }
        });

        function goToNovelDetails() {
            const params = new URLSearchParams(window.location.search);
            const novelId = params.get('id');
            if (novelId) {
                window.location.href = 'novel.html?id=' + novelId;
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        let fontSize = parseInt(localStorage.getItem('readerFontSize')) || 18;
        
        function toggleFontSize() {
            const pageInner = document.getElementById('pageInner');
            if (!pageInner) return;
            
            if (fontSize < 24) {
                fontSize += 2;
            } else {
                fontSize = 16;
            }
            pageInner.style.fontSize = fontSize + 'px';
            localStorage.setItem('readerFontSize', fontSize);
            
            // Recalculate pages after font change
            setTimeout(() => {
                if (typeof calculatePages === 'function') {
                    calculatePages();
                }
            }, 200);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('readerTheme', isDark ? 'dark' : 'light');
            
            const themeBtn = document.querySelector('[onclick="toggleTheme()"]');
            if (themeBtn) {
                themeBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
            }
        }

        // Restore preferences
        document.addEventListener('DOMContentLoaded', function() {
            const savedFontSize = localStorage.getItem('readerFontSize');
            if (savedFontSize) {
                fontSize = parseInt(savedFontSize);
                const pageInner = document.getElementById('pageInner');
                if (pageInner) {
                    pageInner.style.fontSize = fontSize + 'px';
                }
            }

            const savedTheme = localStorage.getItem('readerTheme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                const themeBtn = document.querySelector('[onclick="toggleTheme()"]');
                if (themeBtn) {
                    themeBtn.textContent = '☀️ Light Mode';
                }
            }
        });
    </script>

</body>
</html>
