<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">📖 Story<span>Nest</span></a>
    <a href="author.html" class="login-btn">← Dashboard</a>
</header>

<main class="add-novel-container">
    <div class="add-novel-header">
        <p class="section-label">AUTHOR PROFILE</p>
        <h1>Edit Your Profile</h1>
        <p>Update your author information and bio.</p>
    </div>
    
    <form id="profileForm" class="novel-form">
        <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="profileDisplayName" placeholder="Your author name">
        </div>
        
        <div class="form-group">
            <label>Bio</label>
            <textarea id="profileBio" rows="6" placeholder="Tell readers about yourself..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="profileEmail" disabled>
        </div>
        
        <div class="form-buttons">
            <a href="author.html" class="secondary-btn">Cancel</a>
            <button type="submit" class="primary-btn" id="saveProfile">Save Profile</button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
